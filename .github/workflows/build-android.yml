name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build web app
      run: npm run build

    - name: Sync web resources to Android
      run: npx cap sync android

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Make gradlew executable
      run: chmod +x ./android/gradlew

    - name: Create keystore file from GitHub Secrets
      run: |
        if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "Error: KEYSTORE_BASE64 secret is not set"
          exit 1
        fi
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/android/my-release-key.keystore"
        echo "=== Listing aliases in keystore ==="
        keytool -list -keystore "$GITHUB_WORKSPACE/android/my-release-key.keystore" -storepass "${{ secrets.KEYSTORE_PASSWORD }}"
        ls -la "$GITHUB_WORKSPACE/android/my-release-key.keystore"

    - name: Extract fingerprints from keystore
      run: |
        full_output=$(keytool -list -v -keystore "$GITHUB_WORKSPACE/android/my-release-key.keystore" -alias yinxuseka -storepass "${{ secrets.KEYSTORE_PASSWORD }}")
        sha1=$(echo "$full_output" | grep -i "sha1:" | head -1 | sed 's/.*sha1:\s*//i' | sed 's/\s*$//')
        sha256=$(echo "$full_output" | grep -i "sha256:" | head -1 | sed 's/.*sha256:\s*//i' | sed 's/\s*$//')
        echo "===== 证书指纹 ====="
        echo "SHA1:   $sha1"
        echo "SHA256: $sha256"
        echo "SHA1（无冒号，应用市场用）: $(echo "$sha1" | tr -d ':')"

    - name: Build Android Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        cd android
        ./gradlew clean
        ./gradlew assembleRelease --no-build-cache --no-daemon \
          -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/my-release-key.keystore" \
          -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
          -Pandroid.injected.signing.key.alias=yinxuseka \
          -Pandroid.injected.signing.key.password="${{ secrets.KEYSTORE_PASSWORD }}"
        ls -la app/build/outputs/apk/release/

    - name: Build Android Debug APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
